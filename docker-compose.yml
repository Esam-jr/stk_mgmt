services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stk_pass}
      POSTGRES_DB: ${POSTGRES_DB:-stk_db}
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
